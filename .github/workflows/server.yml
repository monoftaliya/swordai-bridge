# Тесты Cloud Bridge на SQLite и PostgreSQL.
name: Cloud Bridge tests

on:
  push:
    paths: ["server/**", "android/app/src/test/resources/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: Pytest
        working-directory: server
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:test@localhost:5432/bridge' || '' }}
        run: python -m pytest -q
