# Сборка APK в облаке GitHub — компьютер не нужен.
# Actions → «Android APK» → Run workflow; готовые APK — в разделе Artifacts запуска.
name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.SWORDAI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: "Unit tests: подпись, повтор, политика, аргументы"
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: "Restore release keystore (если задан секрет)"
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SWORDAI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          SWORDAI_KEYSTORE_PASSWORD: ${{ secrets.SWORDAI_KEYSTORE_PASSWORD }}
          SWORDAI_KEY_ALIAS: ${{ secrets.SWORDAI_KEY_ALIAS }}
          SWORDAI_KEY_PASSWORD: ${{ secrets.SWORDAI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: "Lint (информационно)"
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v6
        with:
          name: swordai-bridge-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
